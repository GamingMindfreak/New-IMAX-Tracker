Not really — it'd actually make testing harder, not easier. Here's why:

What happens if you switch the movie name:

The "bootstrap" logic is tracked per movie (via bootstrapped_movies in state.json). A new movie name has never been bootstrapped, so:

First run after switching → treated as a fresh bootstrap for that movie. It'll discover all currently-showing sessions and silently record them — no Discord notifications will fire, even if there are wide-open Saver seats sitting right there. This is intentional (so you don't get spammed on first run), but it means your first test run tells you nothing.
Second run (15+ min later) → now it's bootstrapped, and it'll only notify if something genuinely changed between run 1 and run 2 — a session added, or more seats opened in your target rows. If nothing changed in that window (likely, for a real movie), you still get silence — not because notifications are broken, but because nothing new happened.
So switching movies just adds an extra bootstrap cycle and puts you at the mercy of real seat data changing in a random 15-minute window — which defeats the point of a controlled test.

The reliable way is still the state.json edit I mentioned earlier — because it directly fakes a "change" the script will detect on the very next run, with no waiting on real-world data:

Delete one entry from known_session_ids → simulates a "new session" → tests the session-added notification path.
Or lower one session's value in target_counts (e.g. set it to 0) → simulates seats opening up → tests the seat-availability notification path.
Either edit, then trigger the workflow manually once, and you should see a real message land in Discord within that single run — no waiting on a second cycle or hoping the cinema does something in your test window.

